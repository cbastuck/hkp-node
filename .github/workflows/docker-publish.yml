name: Publish Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docker:
    name: hkp-node
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version from package.json
        id: pkg
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # major.minor, by stripping the trailing .patch
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/hkp-node
          # Version comes from package.json: every push to main publishes the current
          # version (X.Y.Z + X.Y), plus latest and the full git SHA. Bump the version
          # in package.json to cut a new release; pushing without bumping overwrites
          # the existing X.Y.Z tag.
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=
            type=raw,value=${{ steps.pkg.outputs.version }}
            type=raw,value=${{ steps.pkg.outputs.minor }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
